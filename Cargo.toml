[package]
name = "tower-http-utils"
license = "MIT"
description = "utilities for working with tower http and hyper"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
http = "1.4.2"
http-body-util = "0.1.4"
hyper = "1.11.0"
hyper-util = { version = "0.1.21", features = ["service", "server", "server-graceful", "server-auto", "tokio"] }
pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
